<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Sarpras SMK Negeri 1 Tambang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1f5f2;--card:#fff;--tx:#14213d;--mu:#64748b;--bd:#e2e8e4;--g:#16a34a;--g2:#0f7a37;--n:#1d2b8f;--y:#facc15;--sh:0 8px 30px rgba(20,33,61,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--card:#14201a;--tx:#e8f0ea;--mu:#93a39a;--bd:#22332a;--sh:0 8px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0c1511;--card:#14201a;--tx:#e8f0ea;--mu:#93a39a;--bd:#22332a;--sh:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:linear-gradient(170deg,#0b6b33,#1d2b8f);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.brand img{width:46px;height:46px;border-radius:50%;background:#fff}
.brand b{display:block;font-size:17px;letter-spacing:.3px}.brand small{opacity:.8;font-size:11px}
nav button{width:100%;text-align:left;background:none;border:0;color:#fff;opacity:.8;padding:11px 14px;border-radius:12px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;display:flex;gap:10px;align-items:center}
nav button:hover{background:rgba(255,255,255,.1);opacity:1}nav button.on{background:#fff;color:var(--n);opacity:1;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.foot{margin-top:auto;font-size:11px;opacity:.7}
main{padding:26px 30px;max-width:1200px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:24px;font-weight:800}.sub{color:var(--mu);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.tools select,.tools input{width:auto}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}.btn:hover{background:var(--g2)}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.s{padding:5px 10px;font-size:12px}.btn.d{background:#dc2626}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--c,var(--g));opacity:.13}
.stat span{color:var(--mu);font-weight:600;font-size:12px}.stat b{display:block;font-size:30px;font-weight:800;margin-top:4px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
h3{margin:0 0 14px;font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12px}.bar i{width:110px;font-style:normal;font-weight:600}.bar div{flex:1;height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--n));border-radius:9px}
.donut{width:130px;height:130px;border-radius:50%;margin:auto;display:grid;place-items:center}.donut span{background:var(--card);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px}
.leg{display:flex;justify-content:center;gap:12px;margin-top:14px;font-size:12px;flex-wrap:wrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);text-align:left;padding:10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid var(--bd)}tr:hover td{background:color-mix(in srgb,var(--g) 5%,transparent)}
.b{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.ok{background:#dcfce7;color:#166534}.wr{background:#fef9c3;color:#854d0e}.no{background:#fee2e2;color:#991b1b}.in{background:#dbeafe;color:#1e40af}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 13px;font-weight:600;font-size:12px;font-family:inherit;cursor:pointer}.chips button.on{background:var(--n);color:#fff;border-color:var(--n)}
dialog{border:0;border-radius:20px;padding:24px;width:min(520px,94vw);background:var(--card);color:var(--tx);box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(10,20,40,.55);backdrop-filter:blur(3px)}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:var(--mu)}.act{display:flex;gap:6px}.fa{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.empty{text-align:center;color:var(--mu);padding:30px}#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(160deg,#0b6b33,#1d2b8f);padding:16px}#login[hidden]{display:none}#login .card{width:min(380px,100%);text-align:center}#login label{text-align:left}#login img{width:84px;height:84px;border-radius:50%;background:#fff}#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;font-weight:600}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{width:100%;margin:0 0 4px}nav{display:flex;overflow-x:auto;gap:4px;width:100%}nav button{white-space:nowrap;width:auto}.foot{display:none}main{padding:18px 14px}.two{grid-template-columns:1fr}}
@media print{aside,.tools,.act,.chips{display:none!important}.app{display:block}}
</style></head><body>

proker:{t:'Program Kerja Sarana',i:'📋',s:'Rencana kerja & anggaran sarana prasarana',f:[['kegiatan','Kegiatan'],['tahun','Tahun','number'],['anggaran','Anggaran (Rp)','number'],['pj','Penanggung Jawab'],['status','Status','select',['Direncanakan','Berjalan','Selesai']]]},

pinjam:{t:'Pemanfaatan & Peminjaman',i:'🔄',s:'Pencatatan penggunaan dan peminjaman barang',f:[['barang','Barang','select',()=>S.inv.map(x=>x.nama)],['peminjam','Peminjam / Unit'],['keperluan','Keperluan'],['tgl','Tanggal Pinjam','date'],['kembali','Tanggal Kembali','date'],['status','Status','select',['Dipinjam','Digunakan','Dikembalikan']]]},
minta:{t:'Permintaan Kebutuhan',i:'📝',s:'Entri kebutuhan dari program keahlian & wakil kepala sekolah',f:[['unit','Unit Pengusul','select',UN],['barang','Barang / Kebutuhan'],['jumlah','Jumlah','number'],['estimasi','Estimasi Biaya (Rp)','number'],['alasan','Alasan / Keterangan','textarea'],['prioritas','Prioritas','select',['Tinggi','Sedang','Rendah']],['status','Status','select',['Diajukan','Disetujui','Ditolak','Terpenuhi']]]}};
M.akun={t:'Akun Bidang',i:'🔐',s:'Kelola akun login masing-masing bidang',f:[['unit','Bidang','select',UN],['username','Username'],['pin','PIN / Kata Sandi','password'],['aktif','Status','select',['Aktif','Nonaktif']]]};
const seed=()=>({
proker:[{id:1,kegiatan:'Rehabilitasi Bengkel TKR',tahun:2026,anggaran:150000000,pj:'Waka Sarpras',status:'Berjalan'},{id:2,kegiatan:'Pengadaan Lab Komputer MPLB',tahun:2026,anggaran:200000000,pj:'Kaprog MPLB',status:'Direncanakan'},{id:3,kegiatan:'Perawatan Mesin Praktik TSM',tahun:2026,anggaran:45000000,pj:'Kaprog TSM',status:'Selesai'}],
inv:[{id:1,kode:'INV-001',nama:'Mesin Bubut',kategori:'Alat Praktik',lokasi:'Bengkel TP',jumlah:6,kondisi:'Baik',tahun:2019},{id:2,kode:'INV-002',nama:'Scanner Mobil',kategori:'Elektronik',lokasi:'Bengkel TKR',jumlah:3,kondisi:'Baik',tahun:2021},{id:3,kode:'INV-003',nama:'Komputer PC',kategori:'Elektronik',lokasi:'Lab MPLB',jumlah:30,kondisi:'Rusak Ringan',tahun:2018},{id:4,kode:'INV-004',nama:'Proyektor',kategori:'Elektronik',lokasi:'Gudang Sarpras',jumlah:8,kondisi:'Baik',tahun:2022},{id:5,kode:'INV-005',nama:'Sepeda Motor Praktik',kategori:'Kendaraan',lokasi:'Bengkel TSM',jumlah:10,kondisi:'Rusak Berat',tahun:2015}],
pinjam:[{id:1,barang:'Proyektor',peminjam:'Waka Kurikulum',keperluan:'Workshop Kurikulum Merdeka',tgl:'2026-10-10',kembali:'2026-10-12',status:'Dikembalikan'},{id:2,barang:'Komputer PC',peminjam:'MPLB',keperluan:'Uji Kompetensi Keahlian',tgl:'2026-10-13',kembali:'2026-10-16',status:'Digunakan'}],
minta:[{id:1,unit:'TKR',barang:'Hydraulic Jack 3 Ton',jumlah:4,estimasi:12000000,alasan:'Praktik kelas XI',prioritas:'Tinggi',status:'Diajukan'},{id:2,unit:'MPLB',barang:'Mesin Fotokopi',jumlah:1,estimasi:25000000,alasan:'Praktik kearsipan',prioritas:'Sedang',status:'Disetujui'},{id:3,unit:'Waka Kesiswaan',barang:'Sound System',jumlah:1,estimasi:8500000,alasan:'Kegiatan OSIS',prioritas:'Rendah',status:'Diajukan'},{id:4,unit:'Waka Humas',barang:'Banner & Booth Pameran',jumlah:2,estimasi:6000000,alasan:'Promosi sekolah',prioritas:'Sedang',status:'Terpenuhi'}]});
let S={proker:[],inv:[],pinjam:[],minta:[],akun:[]},DB=null,ADMIN=false;
const save=()=>{try{localStorage.setItem('esarpras',JSON.stringify(S))}catch(e){}};
let role=ADM,view='dash',q='',fu='Semua';
const adm=()=>role===ADM,nav=()=>[['dash','🏠','Dashboard'],...Object.entries(M).filter(([k])=>adm()||k==='minta').map(([k,m])=>[k,m.i,m.t])];
const bc=v=>({Baik:'ok',Selesai:'ok',Disetujui:'ok',Terpenuhi:'ok',Dikembalikan:'ok',Rendah:'ok','Rusak Ringan':'wr',Berjalan:'in',Digunakan:'in',Sedang:'wr',Diajukan:'wr',Direncanakan:'in',Dipinjam:'wr','Rusak Berat':'no',Ditolak:'no',Tinggi:'no'}[v]||'in');
$('#role').innerHTML=[ADM,...UN].map(u=>`<option>${u}</option>`).join('');
$('#role').onchange=e=>{role=e.target.value;view=adm()?view:'minta';fu='Semua';draw()};
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark'};
function draw(){
$('#nav').innerHTML=nav().map(([k,i,t])=>`<button class="${k===view?'on':''}" data-a="nav" data-k="${k}">${i} ${t}</button>`).join('');
if(view==='dash'){$('#ttl').textContent='Dashboard';$('#sub').textContent='Ringkasan sarana & prasarana SMK Negeri 1 Tambang';dash();if(adm()&&!S.inv.length&&!S.proker.length)$('#v').insertAdjacentHTML('afterbegin','<div class="card" style="margin-bottom:16px"><b>Data bersama masih kosong.</b> <button class="btn s" data-a="seed">Isi data contoh & akun bidang</button></div>')}else list()}
function dash(){
const mine=adm()?S.minta:S.minta.filter(x=>x.unit===role),tot=S.inv.reduce((a,x)=>a+ +x.jumlah,0);
const kd=['Baik','Rusak Ringan','Rusak Berat'],kc=['#16a34a','#facc15','#dc2626'],kv=kd.map(k=>S.inv.filter(x=>x.kondisi===k).reduce((a,x)=>a+ +x.jumlah,0));
const pct=kv.map(v=>v/(tot||1)*100);let a=0;const cg=kc.map((c,i)=>{const s=`${c} ${a}% ${a+pct[i]}%`;a+=pct[i];return s}).join(',');
const per=UN.map(u=>[u,S.minta.filter(x=>x.unit===u).length]),mx=Math.max(1,...per.map(p=>p[1]));
$('#v').innerHTML=`<div class="grid">
<div class="card stat"><span>Total Unit Barang</span><b>${tot}</b></div>
<div class="card stat" style="--c:var(--n)"><span>Program Kerja</span><b>${S.proker.length}</b></div>
<div class="card stat" style="--c:#f59e0b"><span>Sedang Dipinjam/Digunakan</span><b>${S.pinjam.filter(x=>x.status!=='Dikembalikan').length}</b></div>
<div class="card stat" style="--c:#dc2626"><span>${adm()?'Permintaan Menunggu':'Permintaan Saya'}</span><b>${adm()?S.minta.filter(x=>x.status==='Diajukan').length:mine.length}</b></div></div>
<div class="two"><div class="card"><h3>Permintaan Kebutuhan per Unit</h3>${per.map(([u,n])=>`<div class="bar"><i>${u}</i><div><u style="width:${n/mx*100}%"></u></div><b>${n}</b></div>`).join('')}</div>
<div class="card"><h3>Kondisi Barang</h3><div class="donut" style="background:conic-gradient(${cg})"><span>${Math.round(pct[0])}%</span></div><div class="leg">${kd.map((k,i)=>`<span><i style="background:${kc[i]}"></i>${k} (${kv[i]})</span>`).join('')}</div></div></div>
<div class="card" style="margin-top:16px"><h3>Permintaan Terbaru</h3><div class="tw"><table><tr><th>Unit</th><th>Barang</th><th>Estimasi</th><th>Status</th></tr>${mine.slice(-5).reverse().map(x=>`<tr><td>${x.unit}</td><td>${x.barang}</td><td>${rp(x.estimasi)}</td><td><span class="b ${bc(x.status)}">${x.status}</span></td></tr>`).join('')||'<tr><td colspan=4 class="empty">Belum ada data</td></tr>'}</table></div></div>`}
function list(){
const m=M[view];$('#ttl').textContent=m.t;$('#sub').textContent=m.s;
let rows=S[view].filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));
if(view==='minta'){if(!adm())rows=rows.filter(r=>r.unit===role);else if(fu!=='Semua')rows=rows.filter(r=>r.unit===fu)}
const can=r=>adm()||(view==='minta'&&r.status==='Diajukan'),canAdd=adm()||view==='minta';
const cell=(r,[k,,t])=>k==='pin'?'••••••':k==='aktif'?`<span class="b ${r[k]==='Aktif'?'ok':'no'}">${r[k]}</span>`:k==='status'||k==='kondisi'||k==='prioritas'?`<span class="b ${bc(r[k])}">${r[k]}</span>`:k==='anggaran'||k==='estimasi'?rp(r[k]):r[k]??'';
$('#v').innerHTML=`<div class="card">
${view==='minta'&&adm()?`<div class="chips">${['Semua',...UN].map(u=>`<button class="${u===fu?'on':''}" data-a="chip" data-k="${u}">${u}</button>`).join('')}</div>`:''}
<div class="tools" style="margin-bottom:14px"><input id="q" placeholder="🔍 Cari data..." value="${q}" style="min-width:220px">${canAdd?`<button class="btn" data-a="add">+ Tambah</button>`:''}<button class="btn o" data-a="print">🖨 Cetak</button></div>
<div class="tw"><table><tr>${m.f.filter(f=>f[2]!=='textarea').map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>
${rows.map(r=>`<tr>${m.f.filter(f=>f[2]!=='textarea').map(f=>`<td>${cell(r,f)}</td>`).join('')}<td class="act">${can(r)?`<button class="btn o s" data-a="edit" data-id="${r.id}">Ubah</button><button class="btn d s" data-a="del" data-id="${r.id}">Hapus</button>`:''}</td></tr>`).join('')||`<tr><td colspan=9 class="empty">Belum ada data</td></tr>`}</table></div></div>`;
const i=$('#q');i.oninput=e=>{q=e.target.value;list();const n=$('#q');n.focus();n.setSelectionRange(q.length,q.length)}}
function form(id){
const m=M[view],r=S[view].find(x=>x.id===id)||{};
$('#f').innerHTML=`<h3>${id?'Ubah':'Tambah'} ${m.t}</h3>`+m.f.map(([k,l,t,o])=>{let v=r[k]??'';if(view==='minta'&&k==='unit'&&!adm())v=role;
if(view==='minta'&&k==='status'&&!adm())return'';
const opts=typeof o==='function'?o():o;
return`<label>${l}</label>`+(t==='select'?`<select name="${k}" ${k==='unit'&&!adm()?'disabled':''}>${opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="2">${v}</textarea>`:`<input name="${k}" type="${t||'text'}" value="${t==='password'?'':v}" ${t==='password'&&id?'placeholder="Kosongkan jika tidak diubah"':'required'}>`)}).join('')+`<div class="fa"><button type="button" class="btn o" data-a="cancel">Batal</button><button class="btn" type="submit">Simpan</button></div>`;
$('#f').onsubmit=e=>{e.preventDefault();const fd=new FormData($('#f'));const o={};m.f.forEach(([k,,t])=>{let v=fd.get(k);if(view==='minta'&&k==='unit'&&!adm())v=role;if(view==='minta'&&k==='status'&&!adm())v=r.status||'Diajukan';o[k]=t==='number'?+v:v});
submit(r,o,id)};
$('#dlg').showModal()}
function del(id){$('#f').innerHTML=`<h3>Hapus data?</h3><p class="sub">Data yang dihapus tidak dapat dikembalikan.</p><div class="fa"><button type="button" class="btn o" data-a="cancel">Batal</button><button type="button" class="btn d" data-a="yes" data-id="${id}">Hapus</button></div>`;$('#f').onsubmit=e=>e.preventDefault();$('#dlg').showModal()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2500)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
if(a==='nav'){view=b.dataset.k;q='';draw()}
else if(a==='chip'){fu=b.dataset.k;list()}
else if(a==='add')form();
else if(a==='edit')form(id);
else if(a==='del')del(id);
else if(a==='yes'){wr(()=>DB.collection(view).doc(String(id)).delete()).then(ok=>{$('#dlg').close();ok&&toast('Data dihapus')})}
else if(a==='seed')seedAll();
else if(a==='cancel')$('#dlg').close();
else if(a==='print'){try{window.print()}catch(x){toast('Tekan Ctrl+P untuk mencetak')}}});
async function wr(f){try{await f();return true}catch(e){toast('Gagal menyimpan: tidak ada izin atau koneksi terputus');return false}}
async function hash(u,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function submit(r,o,id){const nid=String(id||Date.now());
if(view==='akun'){const pin=o.pin;delete o.pin;o.username=o.username.trim().toLowerCase();
if(pin)o.hash=await hash(o.username,pin);else if(!id||o.username!==r.username){toast('PIN wajib diisi');return}
if(S.akun.some(x=>x.username===o.username&&String(x.id)!==nid)){toast('Username sudah dipakai');return}}
if(await wr(()=>DB.collection(view).doc(nid).set({...r,...o,id:+nid}))){$('#dlg').close();toast('Data tersimpan')}}
async function seedAll(){const d=seed();for(const c in d)for(const r of d[c])await wr(()=>DB.collection(c).doc(String(r.id)).set(r));
for(const [i,u] of UN.entries()){const n=u.toLowerCase().replace(/\s/g,'');await wr(()=>hash(n,'tambang2026').then(h=>DB.collection('akun').doc(String(i+1)).set({id:i+1,unit:u,username:n,hash:h,aktif:'Aktif'})))}toast('Data contoh dimuat. PIN awal akun: tambang2026')}
function auth(){let u=null;try{u=sessionStorage.getItem('es_u')}catch(e){}
const a=ADMIN?null:S.akun.find(x=>x.username===u&&x.aktif==='Aktif');
if(ADMIN)role=ADM;else if(a)role=a.unit;
$('#login').hidden=ADMIN||!!a;$('#who').textContent=ADMIN?'👤 Admin Sarpras':a?'👤 '+a.unit:'';$('#out').hidden=ADMIN||!a;
if(!nav().some(n=>n[0]===view))view='dash';
if(ADMIN||a)draw()}
$('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,a=S.akun.find(x=>x.username===u&&x.aktif==='Aktif');
if(a&&a.hash===await hash(u,p)){try{sessionStorage.setItem('es_u',u)}catch(x){}$('#lp').value='';$('#le').textContent='';auth()}else $('#le').textContent='Username/PIN salah, atau akun nonaktif'};
$('#out').onclick=()=>{try{sessionStorage.removeItem('es_u')}catch(e){}role='';auth()};
$('#login img').src=$('.brand img').src;
function localDB(){let d={};try{d=JSON.parse(localStorage.getItem('esdb'))||{}}catch(e){}
const L={},sv=()=>{try{localStorage.setItem('esdb',JSON.stringify(d))}catch(e){}},snap=c=>({docs:Object.entries(d[c]||{}).map(([id,v])=>({id,data:()=>v}))}),fire=c=>(L[c]||[]).forEach(f=>f(snap(c)));
return{collection:c=>({doc:id=>({set:async v=>{(d[c]=d[c]||{})[id]=v;sv();fire(c)},delete:async()=>{delete (d[c]||{})[id];sv();fire(c)}}),onSnapshot:f=>{(L[c]=L[c]||[]).push(f);f(snap(c))}})}}
const waitC=()=>new Promise(r=>{let n=0;const t=setInterval(()=>{if(window.claude||++n>40){clearInterval(t);r(window.claude)}},100)});
$('#v').innerHTML='<div class="card empty">Memuat data…</div>';
(async()=>{let U=null,db=null,local=false;
try{const cl=await waitC();if(cl){U=await cl.use('user');db=await cl.use('db')}}catch(e){}
if(db){DB=db;ADMIN=!!(U&&U.canEdit())}else{DB=localDB();ADMIN=true;local=true}
['proker','inv','pinjam','minta','akun'].forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:+d.id}));if(!document.activeElement||document.activeElement.id!=='q')auth()},()=>{}));
auth();if(local)toast('Mode lokal: data hanya tersimpan di perangkat ini');
})();
</script></body></html>
